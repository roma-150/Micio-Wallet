<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="rgb(70, 38, 120)">
  <title>Micio-Wallet</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: rgb(70, 38, 120);
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="micio-wallet-frame"
          src="https://script.google.com/macros/s/AKfycbwSAUYQv-tppaPpPKDQrVXtvkID5SXG1MAGZX2MzvO5L6qIynGNjFr-TkcRKTxkUo-R/exec"
          allow="clipboard-write; web-share"
          title="Micio-Wallet"></iframe>
  <script>
    // Aggiunge un parametro univoco all'URL dell'iframe ad ogni caricamento della pagina,
    // per evitare che il browser (o proxy intermedi) servano una versione cachata dell'app
    // dopo una nuova distribuzione su Apps Script.
    (function() {
      const frame = document.getElementById('micio-wallet-frame');
      const separatore = frame.src.indexOf('?') === -1 ? '?' : '&';
      frame.src = frame.src + separatore + 'cachebust=' + Date.now();
    })();
  </script>

  <!-- AGGIUNTA: overlay che blocca l'uso in orizzontale su mobile -->
  <div id="rotate-overlay" style="
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    color: white;
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-family: -apple-system, sans-serif;
  ">
    <div style="font-size: 60px; margin-bottom: 20px;">📱</div>
    <p style="font-size: 18px; font-weight: 600;">Ruota il telefono in verticale</p>
    <p style="font-size: 14px; opacity: 0.7; margin-top: 8px;">Questa app è ottimizzata solo per l'uso in verticale</p>
  </div>

  <style>
    @media screen and (max-width: 926px) and (orientation: landscape) {
      #rotate-overlay {
        display: flex !important;
      }
    }
  </style>
</body>
</html>
