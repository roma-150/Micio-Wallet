<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Micio-Wallet - Gestionale Scout</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbwXJRYebWqKQpsHfWckv09C98lIQzq5DyWsYUZMvF6MuyJpL1infv0dmwzZ65ef8DwD/exec"
          allow="clipboard-write"
          title="Micio-Wallet"></iframe>

  <!-- AGGIUNTA: overlay che blocca l'uso in orizzontale su mobile -->
  <div id="rotate-overlay" style="
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    color: white;
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-family: -apple-system, sans-serif;
  ">
    <div style="font-size: 60px; margin-bottom: 20px;">📱</div>
    <p style="font-size: 18px; font-weight: 600;">Ruota il telefono in verticale</p>
    <p style="font-size: 14px; opacity: 0.7; margin-top: 8px;">Questa app è ottimizzata solo per l'uso in verticale</p>
  </div>

  <style>
    @media screen and (max-width: 926px) and (orientation: landscape) {
      #rotate-overlay {
        display: flex !important;
      }
    }
  </style>
</body>
</html>
